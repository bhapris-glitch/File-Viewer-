<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal File Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .file-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-input input[type="file"] {
            display: none;
        }

        .file-input label {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: 500;
        }

        .file-input label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: calc(100vh - 150px);
        }

        .file-list {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .file-list h2 {
            margin-bottom: 15px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            border: 1px solid transparent;
        }

        .file-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .file-item.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .file-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            font-size: 0.8rem;
            color: #888;
            margin-left: 10px;
        }

        .file-item.active .file-size {
            color: #ddd;
        }

        .viewer-area {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .viewer-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
        }

        .viewer-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .control-btn:hover {
            background: #e0e0e0;
        }

        .viewer-content {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .viewer-content img,
        .viewer-content video,
        .viewer-content audio {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .viewer-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .viewer-content pre {
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #282c34;
            color: #abb2bf;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .viewer-content table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .viewer-content th,
        .viewer-content td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        .viewer-content th {
            background: #667eea;
            color: white;
        }

        .viewer-content tr:nth-child(even) {
            background: #f9f9f9;
        }

        .empty-state {
            text-align: center;
            color: #888;
            font-size: 1.2rem;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .error-message {
            color: #dc3545;
            background: #f8d7da;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-viewer {
                grid-template-columns: 1fr;
                height: auto;
            }

            .file-list {
                max-height: 200px;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 Universal File Viewer</h1>
            <div class="file-input">
                <input type="file" id="fileInput" multiple>
                <label for="fileInput">📂 Select Files</label>
                <button class="control-btn" onclick="clearFiles()">🗑️ Clear</button>
            </div>
        </div>

        <div class="main-viewer">
            <div class="file-list">
                <h2>📄 Files</h2>
                <div id="fileList"></div>
            </div>

            <div class="viewer-area">
                <div class="viewer-header">
                    <div class="viewer-title" id="viewerTitle">Select a file to view</div>
                    <div class="viewer-controls">
                        <button class="control-btn" onclick="zoomIn()">🔍+</button>
                        <button class="control-btn" onclick="zoomOut()">🔍-</button>
                        <button class="control-btn" onclick="resetZoom()">🔄</button>
                        <button class="control-btn" onclick="downloadFile()">⬇️</button>
                    </div>
                </div>
                <div class="viewer-content" id="viewerContent">
                    <div class="empty-state">
                        <i>📂</i>
                        <p>Select a file to view its contents</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // File storage
        let files = [];
        let currentFile = null;
        let zoomLevel = 1;

        // Supported file types
        const supportedTypes = {
            'pdf': 'PDF Document',
            'jpg': 'JPEG Image',
            'jpeg': 'JPEG Image',
            'png': 'PNG Image',
            'gif': 'GIF Image',
            'svg': 'SVG Image',
            'html': 'HTML Document',
            'htm': 'HTML Document',
            'docx': 'Word Document',
            'xlsx': 'Excel Spreadsheet',
            'xls': 'Excel Spreadsheet',
            'md': 'Markdown',
            'txt': 'Text File',
            'mp3': 'Audio',
            'mp4': 'Video',
            'webm': 'Video',
            'ogg': 'Audio',
            'wav': 'Audio',
            'json': 'JSON',
            'xml': 'XML',
            'css': 'CSS',
            'js': 'JavaScript',
            'csv': 'CSV'
        };

        // File icons
        const fileIcons = {
            'pdf': '📕',
            'jpg': '🖼️',
            'jpeg': '🖼️',
            'png': '🖼️',
            'gif': '🎞️',
            'svg': '🎨',
            'html': '🌐',
            'htm': '🌐',
            'docx': '📘',
            'xlsx': '📊',
            'xls': '📊',
            'md': '📝',
            'txt': '📄',
            'mp3': '🎵',
            'mp4': '🎬',
            'webm': '🎬',
            'ogg': '🎵',
            'wav': '🎵',
            'json': '📋',
            'xml': '📋',
            'css': '🎨',
            'js': '⚙️',
            'csv': '📊'
        };

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const selectedFiles = Array.from(e.target.files);
            selectedFiles.forEach(file => {
                files.push({
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    file: file,
                    extension: getExtension(file.name)
                });
            });
            renderFileList();
            if (files.length > 0) {
                selectFile(0);
            }
            this.value = '';
        });

        // Get file extension
        function getExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }

        // Format file size
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Render file list
        function renderFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            files.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item' + (index === currentFile ? ' active' : '');
                fileItem.onclick = () => selectFile(index);
                
                const icon = fileIcons[file.extension] || '📄';
                fileItem.innerHTML = `
                    <span class="file-icon">${icon}</span>
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${formatSize(file.size)}</span>
                `;
                
                fileList.appendChild(fileItem);
            });
        }

        // Select file
        function selectFile(index) {
            currentFile = index;
            renderFileList();
            const file = files[index];
            document.getElementById('viewerTitle').textContent = file.name;
            displayFile(file);
        }

        // Display file content
        function displayFile(file) {
            const viewer = document.getElementById('viewerContent');
            const extension = file.extension;
            
            // Show loading
            viewer.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            const reader = new FileReader();
            
            switch(extension) {
                case 'pdf':
                    reader.onload = function(e) {
                        const blob = new Blob([file], {type: 'application/pdf'});
                        const url = URL.createObjectURL(blob);
                        viewer.innerHTML = `<iframe src="${url}" type="application/pdf"></iframe>`;
                    };
                    reader.readAsArrayBuffer(file);
                    break;
                    
                case 'jpg':
                case 'jpeg':
                case 'png':
                case 'gif':
                case 'svg':
                    reader.onload = function(e) {
                        viewer.innerHTML = `<img src="${e.target.result}" alt="${file.name}" style="transform: scale(${zoomLevel})">`;
                    };
                    reader.readAsDataURL(file);
                    break;
                    
                case 'html':
                case 'htm':
                    reader.onload = function(e) {
                        viewer.innerHTML = `<iframe srcdoc="${escapeHtml(e.target.result)}"></iframe>`;
                    };
                    reader.readAsText(file);
                    break;
                    
                case 'docx':
                    reader.onload = function(e) {
                        // Simple DOCX viewer (shows raw content)
                        viewer.innerHTML = `<pre>${escapeHtml(e.target.result)}</pre>`;
                    };
                    reader.readAsText(file);
                    break;
                    
                case 'xlsx':
                case 'xls':
                    reader.onload = function(e) {
                        // Simple Excel viewer (shows raw content)
                        viewer.innerHTML = `<pre>${escapeHtml(e.target.result)}</pre>`;
                    };
                    reader.readAsText(file);
                    break;
                    
                case 'md':
                    reader.onload = function(e) {
                        // Simple Markdown viewer
                        const content = e.target.result;
                        viewer.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
                    };
                    reader.readAsText(file);
                    break;
                    
                case 'txt':
                case 'json':
                case 'xml':
                case 'css':
                case 'js':
                case 'csv':
                    reader.onload = function(e) {
                        viewer.innerHTML = `<pre>${escapeHtml(e.target.result)}</pre>`;
                    };
                    reader.readAsText(file);
                    break;
                    
                case 'mp3':
                case 'ogg':
                case 'wav':
                    reader.onload = function(e) {
                        viewer.innerHTML = `<audio controls src="${e.target.result}"></audio>`;
                    };
                    reader.readAsDataURL(file);
                    break;
                    
                case 'mp4':
                case 'webm':
                    reader.onload = function(e) {
                        viewer.innerHTML = `<video controls src="${e.target.result}"></video>`;
                    };
                    reader.readAsDataURL(file);
                    break;
                    
                default:
                    viewer.innerHTML = `
                        <div class="empty-state">
                            <i>❓</i>
                            <p>Unsupported file format: .${extension}</p>
                            <p>Supported formats: ${Object.keys(SUPPORTED_FORMATS).join(', ')}</p>
                        </div>
                    `;
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Zoom controls
        function zoomIn() {
            zoomLevel = Math.min(zoomLevel + 0.1, 3);
            applyZoom();
        }

        function zoomOut() {
            zoomLevel = Math.max(zoomLevel - 0.1, 0.5);
            applyZoom();
        }

        function resetZoom() {
            zoomLevel = 1;
            applyZoom();
        }

        function applyZoom() {
            const viewer = document.getElementById('viewerContent');
            const img = viewer.querySelector('img');
            if (img) {
                img.style.transform = `scale(${zoomLevel})`;
            }
        }

        // Download file
        function downloadFile() {
            if (currentFile !== null) {
                const file = files[currentFile];
                const url = URL.createObjectURL(file);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        // Clear files
        function clearFiles() {
            files = [];
            currentFile = null;
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('viewerContent').innerHTML = `
                <div class="empty-state">
                    <i>📂</i>
                    <p>Select a file to view</p>
                </div>
            `;
            document.getElementById('viewerTitle').textContent = 'No file to view';
        }

        // Drag and drop support
        const dropZone = document.querySelector('.viewer-area');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.border = '2px dashed #667eea';
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.border = 'none';
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.border = 'none';
            const droppedFiles = Array.from(e.dataTransfer.files);
            droppedFiles.forEach(file => {
                files.push({
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    file: file,
                    extension: getExtension(file.name)
                });
            });
            renderFileList();
            if (files.length > 0) {
                selectFile(files.length - droppedFiles.length);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === '+') {
                e.preventDefault();
                zoomIn();
            } else if (e.ctrlKey && e.key === '-') {
                e.preventDefault();
                zoomOut();
            } else if (e.ctrlKey && e.key === '0') {
                e.preventDefault();
                resetZoom();
            }
        });

        // Initialize
        console.log('Universal File Viewer initialized');
        console.log('Supported formats:', Object.keys(SUPPORTED_FORMATS).join(', '));
    </script>
</body>
</html>
